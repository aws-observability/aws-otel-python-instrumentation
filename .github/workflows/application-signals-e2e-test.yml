# This is a reusable workflow for running the E2E test for Application Signals.
# It is meant to be called from another workflow.
# Read more about reusable workflows: https://docs.github.com/en/actions/using-workflows/reusing-workflows#overview
name: E2E Testing
on:
  workflow_call:
    inputs:
      staging-wheel-name:
        required: true
        type: string
      adot-image-name:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: false


jobs:
  upload-main-build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 #5.0.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ACCOUNT_ID }}:role/${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ROLE_NAME }}
          aws-region: us-east-1

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 #5.0.0
        with:
          name: ${{ inputs.staging-wheel-name }}

      - name: Upload main-build adot.whl to s3
        run: aws s3 cp ${{ inputs.staging-wheel-name }} s3://adot-main-build-staging-jar/${{ inputs.staging-wheel-name }}

  #
  # PACKAGED DISTRIBUTION LANGUAGE VERSION COVERAGE
  # DEFAULT SETTING: {Python Version}, EC2, AMD64, AL2
  #

  default-py310-amd64:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-ec2-default-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      python-version: '3.10'
      cpu-architecture: 'x86_64'
      staging-wheel-name: ${{ inputs.staging-wheel-name }}

  default-py311-amd64:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-ec2-default-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      python-version: '3.11'
      cpu-architecture: 'x86_64'
      staging-wheel-name: ${{ inputs.staging-wheel-name }}

  default-py312-amd64:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-ec2-default-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      python-version: '3.12'
      cpu-architecture: 'x86_64'
      staging-wheel-name: ${{ inputs.staging-wheel-name }}

  python-ec2-adaptive-sampling-test:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-ec2-adaptive-sampling-test.yml@main
    secrets: inherit
    with:
      caller-workflow-name: 'main-build'
      staging-wheel-name: ${{ inputs.staging-wheel-name }}

  default-py313-amd64:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-ec2-default-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      python-version: '3.13'
      cpu-architecture: 'x86_64'
      staging-wheel-name: ${{ inputs.staging-wheel-name }}

  default-py314-amd64:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-ec2-default-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      python-version: '3.14'
      cpu-architecture: 'x86_64'
      staging-wheel-name: ${{ inputs.staging-wheel-name }}

  adot-di:
    needs: [ upload-main-build ]
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-ec2-adot-di-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      python-version: ${{ matrix.python-version }}
      cpu-architecture: 'x86_64'
      staging-wheel-name: ${{ inputs.staging-wheel-name }}

  #
  # DOCKER DISTRIBUTION LANGUAGE VERSION COVERAGE
  # DEFAULT SETTING: {Python Version}, EKS, AMD64, AL2
  #

  eks-py310-amd64:
    if: ${{ always() }}
    # Run after service-events-eks so it gets the clean (default-image) operator it needs first.
    needs: service-events-eks
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-eks-test.yml@EKS-test-fix
    secrets: inherit
    with:
      aws-region: us-east-1
      test-cluster-name: 'e2e-python-adot-test'
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      python-version: '3.10'

  eks-py311-amd64:
    if: ${{ always() }}
    # Run after service-events-eks so it gets the clean (default-image) operator it needs first.
    needs: service-events-eks
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-eks-test.yml@EKS-test-fix
    secrets: inherit
    with:
      aws-region: us-east-1
      test-cluster-name: 'e2e-python-adot-test'
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      python-version: '3.11'

  eks-py312-amd64:
    if: ${{ always() }}
    # Run after service-events-eks so it gets the clean (default-image) operator it needs first.
    needs: service-events-eks
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-eks-test.yml@EKS-test-fix
    secrets: inherit
    with:
      aws-region: us-east-1
      test-cluster-name: 'e2e-python-adot-test'
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      python-version: '3.12'

  eks-py313-amd64:
    if: ${{ always() }}
    # Run after service-events-eks so it gets the clean (default-image) operator it needs first.
    needs: service-events-eks
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-eks-test.yml@EKS-test-fix
    secrets: inherit
    with:
      aws-region: us-east-1
      test-cluster-name: 'e2e-python-adot-test'
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      python-version: '3.13'

  eks-py314-amd64:
    if: ${{ always() }}
    # Run after service-events-eks so it gets the clean (default-image) operator it needs first.
    needs: service-events-eks
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-eks-test.yml@EKS-test-fix
    secrets: inherit
    with:
      aws-region: us-east-1
      test-cluster-name: 'e2e-python-adot-test'
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      python-version: '3.14'

  #
  # PACKAGED DISTRIBUTION PLATFORM COVERAGE
  # DEFAULT SETTING: Python 3.10, {Platform}, AMD64, AL2
  #

  asg-py310-amd64:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-ec2-asg-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      python-version: '3.10'
      staging-wheel-name: ${{ inputs.staging-wheel-name }}

  #
  # DOCKER DISTRIBUTION PLATFORM COVERAGE
  # DEFAULT SETTING: Python 3.10, {Platform}, AMD64, AL2
  #

  k8s-py310-amd64:
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-k8s-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      python-version: '3.10'


  ecs-py310-amd64:
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-ecs-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      python-version: '3.10'

  #
  # CPU ARCHITECTURE COVERAGE
  # DEFAULT SETTING: Python 3.10, EC2, {CPU Architecture}, AL2
  #

  default-py310-arm64:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-ec2-default-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      python-version: '3.10'
      cpu-architecture: 'arm64'
      staging-wheel-name: ${{ inputs.staging-wheel-name }}

  #
  # Lambda layer integration tests
  lambda:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-lambda-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      python-version: ${{ matrix.python-version }}
      caller-workflow-name: 'main-build'

  # Lambda layer Lite SDK (Fast Start) integration tests
  lambda-lite-sdk:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-lambda-lite-sdk-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      python-version: ${{ matrix.python-version }}
      caller-workflow-name: 'main-build'

  #
  # Stand-Alone ADOT/ADOT SigV4 test on EC2
  adot-sigv4:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-ec2-adot-sigv4-test.yml@main
    secrets: inherit
    with:
      caller-workflow-name: 'main-build'
      staging-wheel-name: ${{ inputs.staging-wheel-name }}
  
  # Stand-Alone ADOT GenAI v1 test on EC2 for collector-less setup
  adot-genai-v1:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-ec2-genai-v1-test.yml@main
    secrets: inherit
    with:
      caller-workflow-name: 'main-build'
      staging-wheel-name: ${{ inputs.staging-wheel-name }}

  # AgentCore Collector GenAI v2 test on EC2 for collector setup
  adot-genai-v2:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-ec2-genai-v2-test.yml@main
    secrets: inherit
    with:
      caller-workflow-name: 'main-build'
      staging-wheel-name: ${{ inputs.staging-wheel-name }}

  service-events-ec2:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-ec2-service-events-test.yml@main
    secrets: inherit
    with:
      caller-workflow-name: 'main-build'
      staging-wheel-name: ${{ inputs.staging-wheel-name }}

  service-events-eks:
    # Runs FIRST, alone, before the parallel eks-py* jobs (which declare `needs: service-events-eks`).
    # service-events uses the shared patch_image_and_check_diff action, which asserts the operator's
    # ADOT image *changed* (default -> staging). That only holds on an operator still at the default
    # image. The parallel eks-py* jobs patch the shared cluster-wide operator to the staging image and
    # intentionally do not revert it (revert would break sibling jobs), so if service-events ran after
    # them it would see the operator already on staging and the diff check would fail. Running it first,
    # exclusively, gives it the clean operator state it expects without modifying the test itself.
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-eks-service-events-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      test-cluster-name: 'e2e-python-adot-test'
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      python-version: '3.10'

  # This validation is to ensure that all test workflows relevant to this repo are actually
  # being used in this repo, which is referring to all the other jobs in this file.
  #
  # If this starts failing, then it most likely means that new e2e test workflow was
  # added to `aws-observability/aws-application-signals-test-framework`, but was not
  # added to this file. It could also mean that a test in this file has been removed.
  #
  # If a particular test file is intended to not be tested in this repo and should not
  # be failing this particular validation, then choose one of the following options:
  # - Add the test file to the exclusions input (CSV format) to the workflow
  #   (see: https://github.com/aws-observability/aws-application-signals-test-framework/blob/main/.github/workflows/validate-e2e-tests-are-accounted-for.yml#L1)
  # - Update the `validate-e2e-tests-are-accounted-for` job to change which "workflow files are expected to be used by this repo"
  #   (see: https://github.com/aws-observability/aws-application-signals-test-framework/blob/main/.github/workflows/validate-e2e-tests-are-accounted-for.yml)
  validate-all-tests-are-accounted-for:
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/validate-e2e-tests-are-accounted-for.yml@main
