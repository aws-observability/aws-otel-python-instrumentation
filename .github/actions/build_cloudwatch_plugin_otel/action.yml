name: Build cloudwatch-plugin-otel
description: Build the cloudwatch-plugin-otel wheel and source distribution.

outputs:
  version:
    description: Version of the built cloudwatch-plugin-otel package.
    value: ${{ steps.plugin_version.outputs.PLUGIN_VERSION }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c #v6.0.0
      with:
        python-version: '3.11'

    - name: Get cloudwatch-plugin-otel version
      id: plugin_version
      shell: bash
      run: |
        plugin_version=$(grep '__version__' cloudwatch-plugin-otel/src/plugins/opentelemetry/cloudwatch/version.py | awk -F '"' '{print $2}')
        echo "PLUGIN_VERSION=$plugin_version" >> "$GITHUB_OUTPUT"

    - name: Build cloudwatch-plugin-otel release artifacts
      shell: bash
      run: |
        pip install build
        python -m build --outdir ../plugin-dist
      working-directory: cloudwatch-plugin-otel
