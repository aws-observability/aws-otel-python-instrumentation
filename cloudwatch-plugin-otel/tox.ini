[tox]
envlist =
    ; cloudwatch-plugin-otel, against the oldest and latest supported OTel
    py3{10,11,12,13,14}-test-cloudwatch-plugin-otel-{oldest,latest}

minversion = 3.10

skip_missing_interpreters = True

skipsdist = True

[testenv]
deps =
    test: pytest
    test: coverage
    test: flask
    test: requests
    test: botocore
    test: sqlalchemy
    oldest: -r {toxinidir}/tests/requirements.oldest.txt
    latest: -r {toxinidir}/tests/requirements.latest.txt

setenv =
    COVERAGE_FILE={toxinidir}/.coverage
    COVERAGE_PROCESS_START={toxinidir}/.coveragerc

changedir =
    test: {toxinidir}

; Install without -e so the tests exercise the real installed package, and
; --no-deps so the pinned OTel versions from the requirements files above win.
commands_pre =
    test: pip install --no-deps {toxinidir}

commands =
    test: coverage run --parallel --source={envsitepackagesdir}/plugins \
        --rcfile={toxinidir}/.coveragerc -m pytest tests/ -ra {posargs}
