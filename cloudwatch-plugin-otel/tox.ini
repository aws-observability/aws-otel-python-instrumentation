[tox]
envlist =
    ; cloudwatch-plugin-otel, against the oldest and latest supported OTel
    py3{10,11,12,13,14}-test-cloudwatch-plugin-otel-{oldest,latest}
    ; the same tests plus the GenAI ones, with the upstream LangChain instrumentation, langchain-core and
    ; langgraph installed (but not the `langchain` package)
    py3{10,11,12,13,14}-test-cloudwatch-plugin-otel-genai-{oldest,latest}

minversion = 3.10

skip_missing_interpreters = True

skipsdist = True

[testenv]
deps =
    test: pytest
    test: coverage
    test: flask
    test: requests
    test: botocore
    ; Capped to the range opentelemetry-instrumentation-sqlalchemy supports. Its
    ; _instruments declares "sqlalchemy >= 1.0.0, < 2.1.0" (still true as of
    ; 0.66b0), and outside that range SQLAlchemyInstrumentor refuses to
    ; instrument, so the span-metrics tests see no spans and fail. Relax this
    ; once upstream raises its ceiling.
    test: sqlalchemy < 2.1.0
    ; The genai envs also carry the oldest/latest factors, so exclude them from the plain requirement files: each
    ; env installs exactly one of the four files below.
    oldest-!genai: -r {toxinidir}/tests/requirements.oldest.txt
    latest-!genai: -r {toxinidir}/tests/requirements.latest.txt
    genai-oldest: -r {toxinidir}/tests/requirements.genai-oldest.txt
    genai-latest: -r {toxinidir}/tests/requirements.genai-latest.txt

setenv =
    COVERAGE_FILE={toxinidir}/.coverage
    COVERAGE_PROCESS_START={toxinidir}/.coveragerc

changedir =
    test: {toxinidir}

; Install without -e so the tests exercise the real installed package, and
; --no-deps so the pinned OTel versions from the requirements files above win.
commands_pre =
    test: pip install --no-deps {toxinidir}

; The genai envs run only the GenAI tests: the base envs already cover span metrics (and the GenAI logic,
; against stand-ins).
commands =
    test-!genai: coverage run --parallel --source={envsitepackagesdir}/plugins,cloudwatch_plugin_otel_hooks \
        --rcfile={toxinidir}/.coveragerc -m pytest tests/ -ra {posargs}
    test-genai: coverage run --parallel --source={envsitepackagesdir}/plugins,cloudwatch_plugin_otel_hooks \
        --rcfile={toxinidir}/.coveragerc -m pytest tests/genai -ra {posargs}
