[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "cloudwatch-plugin-otel"
dynamic = ["version"]
description = "Amazon CloudWatch plugin for OpenTelemetry"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
  { name = "Amazon Web Services" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "opentelemetry-api >= 1.42.0",
  "opentelemetry-sdk >= 1.42.0",
  "opentelemetry-instrumentation >= 0.63b0",
  "opentelemetry-semantic-conventions >= 0.63b0",
  "typing-extensions >= 4.5.0",
]

[project.optional-dependencies]
test = []
# The upstream LangChain/LangGraph GenAI instrumentation (it brings opentelemetry-util-genai). The `langchain`
# framework package is deliberately not included: the plugin activates the instrumentor with langchain-core alone.
langchain = [
  "opentelemetry-instrumentation-genai-langchain >= 1.3b0, < 2",
]

[project.entry-points.opentelemetry_instrumentor]
span_metrics = "plugins.opentelemetry.cloudwatch.span_metrics.instrumentor:SpanMetricsInstrumentor"

# The hooks target a top-level, stdlib-only shim rather than the `plugins` namespace package, which an
# application's own `plugins/` directory can shadow (see src/cloudwatch_plugin_otel_hooks.py).
[project.entry-points.opentelemetry_pre_instrument]
cloudwatch_plugin = "cloudwatch_plugin_otel_hooks:pre_instrument"

[project.entry-points.opentelemetry_post_instrument]
cloudwatch_plugin = "cloudwatch_plugin_otel_hooks:post_instrument"

[project.urls]
Homepage = "https://github.com/aws-observability/aws-otel-python-instrumentation/tree/main/cloudwatch-plugin-otel"

[tool.hatch.version]
path = "src/plugins/opentelemetry/cloudwatch/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plugins"]

[tool.hatch.build.targets.wheel.force-include]
"src/cloudwatch_plugin_otel_hooks.py" = "cloudwatch_plugin_otel_hooks.py"
